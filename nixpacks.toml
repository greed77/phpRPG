[phases.setup]
nixPkgs = ["nodejs_20", "php83", "php83Packages.composer", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.zip", "php83Extensions.bcmath", "php83Extensions.gd", "python311Packages.supervisor"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh"
]

[start]
cmd = "/assets/start.sh"

[staticAssets]
"start.sh" = '''
#!/bin/bash
mkdir -p /app/storage/framework/views
mkdir -p /app/storage/framework/cache
mkdir -p /app/storage/framework/sessions
mkdir -p /app/storage/logs
chmod -R 775 /app/storage
php artisan config:cache
php artisan route:cache
php artisan view:cache
php artisan migrate --force
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-php.conf" = '''
[program:php]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php artisan serve --host=0.0.0.0 --port=80'
autostart=true
autorestart=true
stderr_logfile=/var/log/worker-php.log
stdout_logfile=/var/log/worker-php.log
'''

"worker-queue.conf" = '''
[program:queue]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php artisan queue:work --tries=3'
autostart=true
autorestart=true
stderr_logfile=/var/log/worker-queue.log
stdout_logfile=/var/log/worker-queue.log
'''

"worker-scheduler.conf" = '''
[program:scheduler]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php artisan schedule:work'
autostart=true
autorestart=true
stderr_logfile=/var/log/worker-scheduler.log
stdout_logfile=/var/log/worker-scheduler.log
'''
